# Backstage override configuration for your local development environment
app:
  listen:
    host: 0.0.0.0
    port: 7007
  baseUrl: ${APP_CONFIG_app_baseUrl}
backend:
  baseUrl: ${APP_CONFIG_backend_baseUrl}
  listen:
    port: 7007
    host: 0.0.0.0

  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: 5432
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}

auth:
  environment: production
  providers:
    github:
      production:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        callbackUrl: ${APP_CONFIG_app_baseUrl}/api/auth/github/handler/frame
        ## uncomment if using GitHub Enterprise
        # enterpriseInstanceUrl: ${AUTH_GITHUB_ENTERPRISE_INSTANCE_URL}
        signIn:
          resolvers:
            # Matches the GitHub username with the Backstage user entity name.
            # See https://backstage.io/docs/auth/github/provider#resolvers for more resolvers.
            - resolver: usernameMatchingUserEntityName
              dangerouslyAllowSignInWithoutUserInCatalog: true


catalog:
  rules:
    - allow: [Component, System, API, Resource, Location, Template]
  locations:
    # Local example data, file locations are relative to the backend process, typically `packages/backend`
    - type: file
      target: /app/entities/users.yaml
      rules:
        - allow: [User]

    - type: file
      target: /app/entities/groups.yaml
      rules:
        - allow: [Group]

    - type: url
      target: https://github.com/vanrajboricha/backstage-software-template/blob/main/python-app/template.yaml
      rules:
        - allow: [Template]

    - type: url
      target: https://github.com/vanrajboricha/backstage-software-template/blob/main/nodejs/template.yaml
      rules:
        - allow: [Template]

    # ── Add terraform template ──────────────────────────────────
    - type: url
      target: https://github.com/vanrajboricha/backstage-software-template/blob/main/terraform-templates/template.yaml
      rules:
        - allow: [Template]

    # ── Add terraform-infra repo for auto-discovery ─────────────
    - type: url
      target: https://github.com/vanrajboricha/terraform-infra/blob/main/catalog-info.yaml
      rules:
        - allow: [Resource]          

  providers:
    awsS3:
      bucketName: tfstate-vanbor-s3-ap-south-1-t4hb
      prefix: /
      region: ap-south-1
      schedule:
        # 🌟 Triggers the catalog processor exactly once every 24 hours
        frequency: { hours: 24 }
        # Increased to 10 minutes to allow ample processing time for 24-hour cycles
        timeout: { minutes: 10 }

proxy:
  endpoints:                          # ← add this level
    '/prometheus/api':
      target: ${PROMETHEUS_URL}
      changeOrigin: true
      secure: false
    '/argocd/api':
      target: ${ARGOCD_BASEURL}/api/v1
      changeOrigin: true
      # Set to false if your internal cluster ArgoCD uses self-signed TLS certificates
      secure: false



sonarqube:
  baseUrl: ${SONARQUBE_BASEURL}
  apiKey: ${SONARQUBE_TOKEN}

argocd:
  baseUrl: ${ARGOCD_BASEURL}
  # Switch from username/password to a secure API token
  appLocatorMethods:
    - type: 'config'
      instances:
        - name: main
          url: ${ARGOCD_BASEURL}
          username: ${ARGOCD_USERNAME}
          password: ${ARGOCD_PASSWORD}

prometheus:
  proxyPath: /prometheus/api

grafana:
  token: ${GRAFANA_TOKEN}
  hosts:
    - id: default
      domain: ${GRAFANA_URL}

techdocs:
  builder: 'local'
  publisher:
    type: 'local'
  generator:
    runIn: local

      #kubernetes:
      # serviceLocatorMethod:
      # type: multiTenant

      # clusterLocatorMethods:
      #- type: config
      #clusters:
      # - name: eks-cluster                          # display name in Backstage
      #    url: ${K8S_URL}                            # EKS API server URL
      #    authProvider: serviceAccount
      #    skipTLSVerify: true                        # for self-signed certs
      #    serviceAccountToken: ${K8S_SA_TOKEN}       # SA token


integrations:
  github:
    - host: github.com
      # This is a Personal Access Token or PAT from GitHub. You can find out how to generate this token, and more information
      # about setting up the GitHub integration here: https://backstage.io/docs/integrations/github/locations#configuration
      token: ${GITHUB_TOKEN}
  awsS3:
    - accessKeyId: ${AWS_ACCESS_KEY_ID}
      secretAccessKey: ${AWS_SECRET_ACCESS_KEY}
